<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Bebas+Neue&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=14">
</head>
<body>
  <div class="top-controls">
    <button id="paletteToggle" class="font-toggle" aria-label="Change color theme" title="Change color theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
        <path d="M12 2a10 10 0 1 0 0 20c1.4 0 2.2-1 2.2-2.1 0-.5-.2-1-.5-1.4-.3-.4-.5-.9-.5-1.4 0-1.1.9-2.1 2.1-2.1H17c2.8 0 5-2.2 5-5C22 5.3 17.5 2 12 2Z"/>
        <circle cx="7.5" cy="10.5" r="1.1" fill="currentColor" stroke="none"/>
        <circle cx="10.5" cy="7" r="1.1" fill="currentColor" stroke="none"/>
        <circle cx="15" cy="7.5" r="1.1" fill="currentColor" stroke="none"/>
        <circle cx="17" cy="11.5" r="1.1" fill="currentColor" stroke="none"/>
      </svg>
    </button>
    <button id="fontToggle" class="font-toggle" aria-label="Change font" title="Change font">Aa</button>
    <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme" title="Toggle theme">🌙</button>
  </div>

  <div class="color-dropdown" id="colorDropdown">
    <button class="color-swatch" data-accent="indigo" aria-label="Indigo" title="Indigo"></button>
    <button class="color-swatch" data-accent="rose" aria-label="Rose" title="Rose"></button>
    <button class="color-swatch" data-accent="emerald" aria-label="Emerald" title="Emerald"></button>
    <button class="color-swatch" data-accent="amber" aria-label="Amber" title="Amber"></button>
    <button class="color-swatch" data-accent="sky" aria-label="Sky" title="Sky"></button>
    <button class="color-swatch" data-accent="violet" aria-label="Violet" title="Violet"></button>
    <button class="color-swatch color-swatch-cyberpunk" data-accent="cyberpunk" aria-label="Cyberpunk" title="Cyberpunk"></button>
  </div>

  <div class="size-control" title="Clock size">
    <svg viewBox="0 0 24 24" fill="currentColor" class="size-icon small"><circle cx="12" cy="12" r="4"/></svg>
    <input type="range" class="range-input" id="sizeSlider" min="50" max="150" step="5" value="100" aria-label="Countdown timer size">
    <svg viewBox="0 0 24 24" fill="currentColor" class="size-icon large"><circle cx="12" cy="12" r="9"/></svg>
  </div>

  <div class="page">
    <div class="flip-clock" id="flipClock">
      <div class="flip-digit" data-role="mTens">
        <div class="flip-static top"><span class="num">0</span></div>
        <div class="flip-static bottom"><span class="num">0</span></div>
        <div class="flip-leaf front"><span class="num">0</span></div>
        <div class="flip-leaf back"><span class="num">0</span></div>
      </div>
      <div class="flip-digit" data-role="mOnes">
        <div class="flip-static top"><span class="num">0</span></div>
        <div class="flip-static bottom"><span class="num">0</span></div>
        <div class="flip-leaf front"><span class="num">0</span></div>
        <div class="flip-leaf back"><span class="num">0</span></div>
      </div>
      <div class="flip-sep">:</div>
      <div class="flip-digit" data-role="sTens">
        <div class="flip-static top"><span class="num">0</span></div>
        <div class="flip-static bottom"><span class="num">0</span></div>
        <div class="flip-leaf front"><span class="num">0</span></div>
        <div class="flip-leaf back"><span class="num">0</span></div>
      </div>
      <div class="flip-digit" data-role="sOnes">
        <div class="flip-static top"><span class="num">0</span></div>
        <div class="flip-static bottom"><span class="num">0</span></div>
        <div class="flip-leaf front"><span class="num">0</span></div>
        <div class="flip-leaf back"><span class="num">0</span></div>
      </div>
    </div>

    <div class="controls">
      <button id="playPauseBtn" class="icon-btn" disabled aria-label="Start" title="Start">
        <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
      </button>
      <button id="resetBtn" class="icon-btn" disabled aria-label="Reset" title="Reset">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v5h5"/></svg>
      </button>
    </div>

    <div class="duration-slider">
      <input type="range" class="range-input" id="durationSlider" min="0" max="4" step="1" value="2" aria-label="Timer duration">
      <div class="slider-ticks">
        <span data-minutes="1" style="left: calc(11px + (100% - 22px) * 0)">1</span>
        <span data-minutes="5" style="left: calc(11px + (100% - 22px) * 0.25)">5</span>
        <span data-minutes="10" style="left: calc(11px + (100% - 22px) * 0.5)">10</span>
        <span data-minutes="25" style="left: calc(11px + (100% - 22px) * 0.75)">25</span>
        <span data-minutes="30" style="left: calc(11px + (100% - 22px) * 1)">30</span>
      </div>
    </div>

  </div>

  <canvas id="confettiCanvas"></canvas>

  <script src="script.js?v=8"></script>
</body>
</html>
